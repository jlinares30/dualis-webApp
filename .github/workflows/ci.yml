name: CI

# Type check, unit tests and production build on every pull request and branch push.
# Lint runs too but does not block yet: the codebase still has pre-existing lint errors
# (see the step output). Make it blocking once they are fixed.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Lint (informative)
        continue-on-error: true
        run: pnpm lint
